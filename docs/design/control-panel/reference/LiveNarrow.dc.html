<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>配信中 狭いウインドウ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width: 400px; height: 900px; box-sizing: border-box; background: #0E1014; color: #ECEEF2; font-family: Inter, 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #262B35; background: #12151B">
    <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="16" fill="#FF4F8B"></rect><circle cx="32" cy="34" r="19" fill="#FFC83D" stroke="#E09A12" stroke-width="3"></circle><ellipse cx="25" cy="26" rx="6" ry="3.6" fill="#FFF6D6" transform="rotate(-35 25 26)"></ellipse></svg>
    <label style="position: relative; display: inline-flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">フェーズ</span><select style="height: 36px; border-radius: 999px; border: 1px solid #343B48; background: #1B1F27; color: #ECEEF2; padding: 0 12px; font-size: 13px; font-weight: 700"><option>配信中</option><option>準備</option><option>振り返り</option></select></label>
    <span style="flex: 1 1 0"></span>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #6B5530; background: #241D12; color: #FFC977; font-weight: 600; font-size: 13px">休憩する</button>
    <button type="button" aria-label="設定" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #2A303B; background: transparent; color: #B5BCC8; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
  </header>
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; min-height: 0">
    <section aria-label="テロップ" style="background: #161A21; border: 1px solid #262B35; border-radius: 14px; padding: 10px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{ keys }}" as="t" hint-placeholder-count="10">
          <button type="button" style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 10px; border-radius: 10px; border: 1px solid #2E3542; background: #222833; color: #ECEEF2; font-size: 14px; font-weight: 600; text-align: left; overflow: hidden; white-space: nowrap"><span style="flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 7px; background: #FF4F8B; color: #1A0710; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">{{ t.key }}</span><span style="overflow: hidden; text-overflow: ellipsis">{{ t.text }}</span></button>
        </sc-for>
      </div>
    </section>
    <section aria-label="サーモンラン" style="background: #161A21; border: 1px solid #262B35; border-radius: 14px; padding: 10px">
      <div style="display: flex; gap: 6px">
        <button type="button" style="flex: 1 1 auto; height: 56px; border-radius: 12px; border: 0; background: #3DDC84; color: #062312; font-size: 16px; font-weight: 700">リザルトを取り込む</button>
        <button type="button" style="flex: none; width: 64px; height: 56px; border-radius: 12px; border: 1px solid #343B48; background: #1B1F27; color: #DDE1E8; font-size: 12px; font-weight: 600">手入力</button>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums"><span><span style="color: #FFC83D">金</span> 1,055</span><span><span style="color: #FF9F6B">オオモノ</span> 561</span><span><span style="color: #B5BCC8">デス</span> 14</span><span><span style="color: #3DDC84">クリア</span> 30/30</span></div>
    </section>
    <section aria-label="視聴者参加" style="background: #161A21; border: 1px solid #2F6B4A; border-radius: 14px; padding: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px"><span style="display: inline-flex; align-items: center; gap: 6px; color: #7FE3B0; font-size: 12px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3DDC84"></span>受付中 · 列 3 人</span><span style="font-size: 13px">いまの人 <strong>視聴者A</strong></span></div>
      <button type="button" style="width: 100%; height: 48px; border-radius: 12px; border: 0; background: #FF4F8B; color: #1A0710; font-size: 15px; font-weight: 700">次の人を呼ぶ</button>
    </section>
    <section aria-label="本日のお題" style="background: #161A21; border: 1px solid #262B35; border-radius: 14px; padding: 4px 10px">
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #3DDC84; margin: 0"><span style="color: #9AA3B2">記録更新いけるところまで!</span></label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid #232832"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #3DDC84; margin: 0"><span>WAVE 3 までデス 0</span></label>
    </section>
    <div style="background: #161A21; border: 1px solid #262B35; border-radius: 14px">
      <button type="button" aria-expanded="false" style="width: 100%; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border: 0; background: transparent; color: #B5BCC8; font-size: 13px; font-weight: 600"><span>ほかのテロップ・エフェクト・クリップ・記録</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var t = ['ナイス!!', 'ドンマイ!', '共闘感謝!', 'ありがとうございました!', '地獄絵図', 'ヤバい', 'ごめーん', 'ありがとう!', 'あぶね', 'おしい'];
    var k = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
    return { keys: t.map(function (x, i) { return { key: k[i], text: x }; }) };
  }
}
</script>
</body>
</html>
