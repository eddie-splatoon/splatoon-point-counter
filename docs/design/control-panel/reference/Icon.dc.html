<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アプリのアイコン</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 960px; height: 540px; box-sizing: border-box; background: #0E1014; color: #ECEEF2; font-family: Inter, 'Noto Sans JP', sans-serif; font-size: 14px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; padding: 36px">
  <div style="background: #161A21; border: 1px solid #262B35; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; gap: 10px"><strong style="font-size: 18px">金イクラ</strong><span style="padding: 2px 10px; border-radius: 999px; background: #2A1720; color: #FF9CC0; font-size: 12px; font-weight: 600">おすすめ</span></div>
    <div style="display: flex; align-items: center; gap: 28px; flex: 1 1 auto">
      <svg width="220" height="220" viewBox="0 0 64 64" role="img" aria-label="金イクラのアイコン 大"><rect x="2" y="2" width="60" height="60" rx="16" fill="#FF4F8B"></rect><circle cx="32" cy="34" r="19" fill="#FFC83D" stroke="#E09A12" stroke-width="3"></circle><circle cx="35" cy="37" r="9" fill="#FFB21F" opacity="0.55"></circle><ellipse cx="25" cy="26" rx="6" ry="3.6" fill="#FFF6D6" transform="rotate(-35 25 26)"></ellipse><circle cx="27" cy="37" r="2.4" fill="#3A2400"></circle><circle cx="38" cy="37" r="2.4" fill="#3A2400"></circle><path d="M29.5 42 q3 2.8 6 0" stroke="#3A2400" stroke-width="2.2" fill="none" stroke-linecap="round"></path><ellipse cx="23" cy="41.5" rx="2.6" ry="1.5" fill="#FF7FA8"></ellipse><ellipse cx="42" cy="41.5" rx="2.6" ry="1.5" fill="#FF7FA8"></ellipse><path d="M51 9 l1.6 3.8 3.8 1.6 -3.8 1.6 -1.6 3.8 -1.6 -3.8 -3.8 -1.6 3.8 -1.6z" fill="#FFF6D6"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: flex-end; gap: 18px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="64px"><rect x="2" y="2" width="60" height="60" rx="16" fill="#FF4F8B"></rect><circle cx="32" cy="34" r="19" fill="#FFC83D" stroke="#E09A12" stroke-width="3"></circle><ellipse cx="25" cy="26" rx="6" ry="3.6" fill="#FFF6D6" transform="rotate(-35 25 26)"></ellipse><circle cx="27" cy="37" r="2.4" fill="#3A2400"></circle><circle cx="38" cy="37" r="2.4" fill="#3A2400"></circle><path d="M29.5 42 q3 2.8 6 0" stroke="#3A2400" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg><span style="color: #9AA3B2; font-size: 11px">64</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="32px"><rect x="2" y="2" width="60" height="60" rx="16" fill="#FF4F8B"></rect><circle cx="32" cy="34" r="20" fill="#FFC83D" stroke="#E09A12" stroke-width="3"></circle><ellipse cx="25" cy="26" rx="6.5" ry="4" fill="#FFF6D6" transform="rotate(-35 25 26)"></ellipse><circle cx="27" cy="37" r="3" fill="#3A2400"></circle><circle cx="38" cy="37" r="3" fill="#3A2400"></circle></svg><span style="color: #9AA3B2; font-size: 11px">32</span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="16px"><rect x="0" y="0" width="16" height="16" rx="4" fill="#FF4F8B"></rect><circle cx="8" cy="8.5" r="5.5" fill="#FFC83D"></circle><circle cx="6.3" cy="6.6" r="1.6" fill="#FFF6D6"></circle></svg><span style="color: #9AA3B2; font-size: 11px">16</span></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 8px; width: 210px; height: 34px; padding: 0 10px; border-radius: 8px 8px 0 0; background: #ECEEF2; color: #1A1D23; font-size: 12px; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="0" y="0" width="16" height="16" rx="4" fill="#FF4F8B"></rect><circle cx="8" cy="8.5" r="5.5" fill="#FFC83D"></circle><circle cx="6.3" cy="6.6" r="1.6" fill="#FFF6D6"></circle></svg>配信パネル</div>
          <div style="display: flex; align-items: center; gap: 8px; width: 210px; height: 34px; padding: 0 10px; border-radius: 8px 8px 0 0; background: #2A2E36; color: #ECEEF2; font-size: 12px; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="0" y="0" width="16" height="16" rx="4" fill="#FF4F8B"></rect><circle cx="8" cy="8.5" r="5.5" fill="#FFC83D"></circle><circle cx="6.3" cy="6.6" r="1.6" fill="#FFF6D6"></circle></svg>配信パネル</div>
        </div>
      </div>
    </div>
    <p style="margin: 0; color: #B5BCC8; font-size: 13px">ピンクの角丸にまん丸の金色。16px は顔を外して「ピンク地に金の玉＋ツヤ」だけにして見分けやすく。</p>
  </div>
  <div style="background: #161A21; border: 1px solid #262B35; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; gap: 10px"><strong style="font-size: 18px">シャケ</strong><span style="padding: 2px 10px; border-radius: 999px; background: #1E232C; color: #B5BCC8; font-size: 12px">別案</span></div>
    <div style="display: flex; align-items: center; justify-content: center; flex: 1 1 auto">
      <svg width="200" height="200" viewBox="0 0 64 64" role="img" aria-label="シャケのアイコン"><rect x="2" y="2" width="60" height="60" rx="16" fill="#1F6B50"></rect><path d="M44 33 L58 21 Q55 33 58 45 Z" fill="#F0724A"></path><path d="M24 21 Q30 12 37 21 Z" fill="#F0724A"></path><ellipse cx="28" cy="33" rx="20" ry="14" fill="#FF8A5B"></ellipse><path d="M10 36 Q28 50 46 36 Q28 44 10 36 Z" fill="#FFD3B8"></path><circle cx="31" cy="25" r="1.6" fill="#E0663F"></circle><circle cx="37" cy="28" r="1.4" fill="#E0663F"></circle><circle cx="34" cy="22.5" r="1.2" fill="#E0663F"></circle><circle cx="18" cy="30" r="4.6" fill="#FFFFFF"></circle><circle cx="17.4" cy="30.6" r="2.7" fill="#2A1A14"></circle><circle cx="16.4" cy="29.4" r="0.9" fill="#FFFFFF"></circle><ellipse cx="23" cy="37" rx="2.5" ry="1.5" fill="#FF6F8E"></ellipse><path d="M12 37 q2.5 2 5 0" stroke="#7A2E1A" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: center; gap: 18px">
      <svg width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="シャケ 32px"><rect x="2" y="2" width="60" height="60" rx="16" fill="#1F6B50"></rect><path d="M44 33 L58 21 Q55 33 58 45 Z" fill="#F0724A"></path><ellipse cx="28" cy="33" rx="20" ry="14" fill="#FF8A5B"></ellipse><circle cx="18" cy="30" r="5" fill="#FFFFFF"></circle><circle cx="17.4" cy="30.6" r="3" fill="#2A1A14"></circle></svg>
      <svg width="16" height="16" viewBox="0 0 64 64" role="img" aria-label="シャケ 16px"><rect x="0" y="0" width="64" height="64" rx="16" fill="#1F6B50"></rect><path d="M42 32 L60 18 Q56 32 60 46 Z" fill="#FF8A5B"></path><ellipse cx="27" cy="32" rx="22" ry="16" fill="#FF8A5B"></ellipse><circle cx="17" cy="29" r="6" fill="#FFFFFF"></circle></svg>
    </div>
    <p style="margin: 0; color: #B5BCC8; font-size: 13px">丸い体に大きな目のふつうの魚。16px ではシルエットが細くなるので、金イクラのほうが小さいサイズに強い。</p>
  </div>
</div>
</x-dc>

</body>
</html>
